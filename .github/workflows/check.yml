name: Public publication boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node scripts/check-public-boundary.mjs
      - run: node --test tests/market.test.mjs
      - run: python3 -m py_compile examples/market.py
